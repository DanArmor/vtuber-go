%YAML 1.1
---
version: "3"

x-logging-shared: &logging-shared
  logging:
    driver: "json-file"
    options:
        max-size: "200m"

x-backend-shared: &backend-shared
  restart: always
  command: ["--config", "./config.yaml"]
  environment:
    GIN_MODE: release
  volumes:
    - ./config.yaml:/opt/vtuber-go/config.yaml:ro
  expose:
    - 8000
  <<: [*logging-shared]

services:
  backend:
    image: ${REGISTRY}/vtuber-go-backend:${TAG}
    <<: [*backend-shared]

  worker:
    image: ${REGISTRY}/vtuber-go-worker:${TAG}
    <<: [*backend-shared]

  db:
    image: postgres:15
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./volumes/postgres-data:/var/lib/postgresql/data
    healthcheck:
       test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
       interval: 5s
       timeout: 5s
       retries: 5
    <<: [*logging-shared]

  frontend:
    image: ${REGISTRY}/vtuber-go-frontend:${TAG}
    expose:
      - 8000
    environment:
      SERVER_NAME: ${SERVER_NAME}
    <<: [*logging-shared]

  gateway:
    image: nginx:latest
    volumes:
      - ./gateway/gateway.conf.template:/etc/nginx/templates/gateway.conf.template:ro
    ports:
      - 8000:8000
    environment:
      SERVER_NAME: ${SERVER_NAME}
    <<: [*logging-shared]